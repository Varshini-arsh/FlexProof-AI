name: FlexProof CI

on:
  push:
    branches:
      - main
      - integration/joint-poc-review
      - review/ci-release-readiness
  pull_request:
    branches:
      - main
      - integration/joint-poc-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexproof-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked Python dependencies
        run: python -m pip install --constraint requirements-ci.lock -e ".[api,dev]"
      - name: Run complete test suite
        run: python -m pytest -q

  postgres-integration:
    name: API and persistence integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flexproof_test
          POSTGRES_USER: flexproof_test
          POSTGRES_PASSWORD: flexproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flexproof_test -d flexproof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLEXPROOF_TEST_DATABASE_URL: postgresql+psycopg://flexproof_test:flexproof_test@localhost:5432/flexproof_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked Python dependencies
        run: python -m pip install --constraint requirements-ci.lock -e ".[api,dev]"
      - name: Run database-backed API integration tests
        run: python -m pytest -q tests/test_api_nominal.py tests/test_api_recovery.py tests/test_api_verification.py tests/test_database.py tests/test_evidence_exports.py

  browser-integration:
    name: End-to-end FP-001 workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: python -m pip install --constraint requirements-ci.lock -e ".[api,dev]"
      - name: Install locked Node dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run UI-to-API integration scenarios
        working-directory: frontend
        env:
          FLEXPROOF_PYTHON: python
        run: npm run test:e2e

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Node dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
