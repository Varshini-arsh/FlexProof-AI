services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLEXPROOF_DB_PATH: /app/data/flexproof_runs.sqlite3
      FLEXPROOF_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - flexproof-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
volumes:
  flexproof-data:
