services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flexproof
      POSTGRES_USER: flexproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    ports:
      - "5433:5432"
    volumes:
      - flexproof-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexproof -d flexproof"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://flexproof:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}@db:5432/flexproof
      FLEXPROOF_CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "8011:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2); assert r.status == 200"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  flexproof-postgres-data:
