[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "flexproof-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0","pandas>=2.2","scipy>=1.13","simpy>=4.1","pyomo>=6.8","highspy>=1.7","statsmodels>=0.14","PyYAML>=6.0","matplotlib>=3.9","jsonschema>=4.22"]
[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0","hypothesis>=6.100","jsonschema>=4.22","httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["simulator*","flexproof*","optimization*","baselines*","evaluation*","contracts*","backend*"]
[tool.setuptools.package-data]
contracts = ["*.json", "*.md", "examples/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
